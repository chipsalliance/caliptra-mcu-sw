# Caliptra Util Host Test Configuration
# This file contains shared test parameters used by both the server and validator

[network]
# Default network configuration
default_server_address = "127.0.0.1:62222"

[validation]
# Validation test configuration
timeout_seconds = 30
retry_count = 3
verbose_output = false

[server]
# Server-specific configuration
bind_address = "127.0.0.1:62222"
max_connections = 10

[device_capabilities]
# Expected device capabilities for validation
capabilities = [
	0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01,
	0x00, 0x00, 0x00, 0x00,
	0x00, 0x00, 0x00, 0x01,
	0x00, 0x00, 0x00, 0x00,
	0x00, 0x00, 0x00, 0xFF,
	0x00, 0x02, 0x00, 0xEF,
	0x00, 0x00, 0x00, 0x09,
	0x00, 0x00, 0x00, 0x00,
]
fips_status = 0x00000001

[firmware_version]
# Expected firmware version information
rom_version = "1.2.3.4567-mock_commit_hash"
runtime_version = "1.2.3.4567-mock_commit_hash"
fips_status = 0x00000001
# Firmware IDs for validation
rom_firmware_id = 0
runtime_firmware_id = 1

[fe_prog]
enabled = true
partition = 0

# Run each destructive fuse command against a fresh device. Enabling multiple
# commands can create order-dependent OTP state and invalidate later tests.
[provision_vendor_pk_hash]
enabled = false
slot = 1
hash = "a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5"

[increase_caliptra_min_svn]
enabled = false
flags = 0
svn = 7

[revoke_vendor_pub_key]
enabled = false
reserved = 0
vendor_pk_hash_slot = 1
key_type = 0
key_index = 0

[revoke_vendor_pk_hash]
enabled = false
reserved = 0
vendor_pk_hash_slot = 1

[fuse_lock_partition]
enabled = false
partition = 14
