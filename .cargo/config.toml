    "--remap-path-prefix=runtime/userspace/api/spdm-lib/vdm-handler/src/iana/ocp/caliptra_vdm/mod.rs=v/m",
    "--remap-path-prefix=runtime/userspace/api/measurement-api/src/lib.rs=m/l",
    "--remap-path-prefix=runtime/userspace/api/measurement-api/src/api/mod.rs=m/m",
    "--remap-path-prefix=platforms/emulator/runtime/userspace/apps/user/src/spdm/mod.rs=sp/m",
