    "--remap-path-prefix=runtime/userspace/api/spdm-lib/vdm-handler/src/iana/ocp/caliptra_vdm/commands/export_attested_csr.rs=v/csr.rs",
    "--remap-path-prefix=runtime/userspace/api/measurement-api/src/attestation_manifest.rs=m/am.rs",
    "--remap-path-prefix=runtime/userspace/api/spdm-lib/pal/src/measurements/providers/ocp_eat.rs=m/eat.rs",
