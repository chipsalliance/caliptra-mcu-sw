[alias]
xtask = "run --package caliptra-mcu-xtask --"
xtask-fpga = "run --package caliptra-mcu-xtask --features=fpga_realtime --"

[target.riscv32imc-unknown-none-elf]
rustflags = [
    "-C",
    "panic=abort",
    "-C",
    "target-feature=+relax,+zba,+zbb,+zbc,+zbs",
    "-C",
    "force-frame-pointers=no",
    # See https://github.com/tock/tock/pull/2853
    "-C",
    "relocation-model=static",
    # Opt-in to Rust v0 symbol mangling scheme.
    #   See https://github.com/rust-lang/rust/issues/60705 and
    #   https://github.com/tock/tock/issues/3529.
    "-C",
    "symbol-mangling-version=v0",
    "-C",
    # Tell rustc to use the LLVM linker. This avoids needing GCC as a
    # dependency to build the kernel.
    "linker=rust-lld",
    "-C",
    # Use the LLVM lld executable with the `-flavor gnu` flag.
    "linker-flavor=ld.lld",
    "-C",
    # lld by default uses a default page size to align program
    # sections. Tock expects that program sections are set back-to-back. `-nmagic`
    # instructs the linker to not page-align sections.
    "link-arg=-nmagic",
    # Identical Code Folding (ICF) set to all. This tells the linker to be
    # more aggressive about removing duplicate code. The default is `safe`, and
    # the downside to `all` is that different functions in the code can end up with
    # the same address in the binary. However, it can save a fair bit of code  size.
    "-C",
    "link-arg=-icf=all",
    # Strip absolute build paths from panic / debug strings to shrink .rodata.
    # Repository sources become relative to repo root; cargo registry sources
    # become "registry/...".  Both reduce the size of file-path strings baked
    # into `core::panicking::panic_fmt` call sites (unwrap/expect/assert/etc.).
    "--remap-path-prefix=/root/caliptra-mcu-sw=.",
    "--remap-path-prefix=/root/.cargo/registry=registry",
    "--remap-path-prefix=/root/.cargo/git=git",
    "--remap-path-prefix=platforms/emulator/runtime/userspace/apps/user/src=a",
    "--remap-path-prefix=platforms/emulator/runtime/userspace/apps/user/src/caliptra_cmd_handler=d",
    "--remap-path-prefix=runtime/userspace/api=api",
    "--remap-path-prefix=runtime/userspace/api/attestation-evidence/src=e",
    "--remap-path-prefix=runtime/userspace/api/caliptra-api/src=c",
    "--remap-path-prefix=runtime/userspace/api/measurement-api/src=m",
    "--remap-path-prefix=runtime/userspace/api/spdm-lib/codec/src=co",
    "--remap-path-prefix=runtime/userspace/api/spdm-lib/pal/src=p",
    "--remap-path-prefix=runtime/userspace/api/spdm-lib/stack/src=s",
    "--remap-path-prefix=runtime/userspace/api/spdm-lib/transports/src=tr",
    "--remap-path-prefix=runtime/userspace/api/spdm-lib/vdm-handler/src=v",
    "--remap-path-prefix=runtime/userspace/libtockasync/src=t",
    "--remap-path-prefix=runtime/userspace/syscall/src=y",
    "--remap-path-prefix=platforms/emulator/runtime/userspace/apps/user/src/cert_store=cs",
    "--remap-path-prefix=platforms/emulator/runtime/userspace/apps/user/src/measurement=b",
    "--remap-path-prefix=platforms/emulator/runtime/userspace/apps/user/src/spdm=sp",
