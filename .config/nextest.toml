[profile.nightly]
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "5m", terminate-after = 6 }

[profile.nightly.junit]
path = "/tmp/junit.xml"
store-success-output = false
store-failure-output = true

[profile.emulator]
store-success-output = false
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 30 }
# TODO: Failing tests tracked in https://github.com/chipsalliance/caliptra-mcu-sw/issues/1335.
default-filter = """
all() - test(test_defmt_logging_release)
"""

[profile.emulator.junit]
path = "/tmp/junit.xml"
store-success-output = false
store-failure-output = true

[profile.usb-host]
inherits = "emulator"
default-filter = 'package(caliptra-mcu-tests-integration) and test(usb::usbip_tests::usbip_linux_)'
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.usb-host.junit]
path = "/tmp/junit-usb.xml"
store-success-output = false
store-failure-output = true

# Requires Carl's Architecture B bitstream; not selected by general FPGA CI.
[profile.usb-fpga]
default-filter = 'package(caliptra-mcu-tests-integration) and test(test_fpga_usb_arch_b)'
test-threads = 1
retries = 0
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.nightly-ci]
inherits = "nightly"
retries = 2
# Tests that program OTP with LifecycleControllerState::Dev as the initial
# state hang the FPGA at "Taking subsystem out of reset" (confirmed locally
# with test_lc_dev_to_prod). Dev-init tests are disabled until that's
# root-caused.
default-filter = """
(package(caliptra-mcu-tests-integration) and test(test_fpga_usb_arch_b_ocp_recovery_boot))
"""
# Disabled because they hang the FPGA at boot (LifecycleControllerState::Dev):
#   test_sw_digest_lock,
#   test_otp_blank_check, test_otp_scramble_check, test_bootfsm_timeout,
#   and the Dev-starting subtests of test_lc_ctrl listed above.
# Disabled because they fail on FPGA:
#   test_fw_manifest_dot_hitless_lock, test_log_flash_usermode,
#   test_mctp_capsule_loopback, test_mcu_mbox_cmds,
#   test_mcu_mbox_fips_periodic, test_mcu_mbox_fips_self_test.
# Disabled pre-existing for flakiness:
#   test_firmware_update_streaming_fpga
#   test_rom_hooks_fire_in_order — SIGABRTs from a caliptra-sw hw-model
#     I3C SETDASA timeout (host cfg_initialize() times out, then a
#     poisoned-lock cascade in Drop) when run after the lifecycle tests;
#     tracked upstream. Still runs on the emulator profile.

[[profile.nightly-ci.overrides]]
filter = "package(caliptra-mcu-tests-integration) and test(test_firmware_update_streaming_fpga)"
# FPGA PLDM firmware-update streaming transfers are slow and now also cover
# Measurement API auth-manifest validation before activation. Keep this timeout
# scoped to the single FPGA streaming test instead of relaxing the full profile.
slow-timeout = { period = "5m", terminate-after = 9 }

[[profile.nightly-ci.overrides]]
filter = "package(caliptra-mcu-tests-integration) and test(test_firmware_activate_fpga)"
# This test performs the flash-backed activation path on FPGA hardware. W7 adds
# auth-manifest validation before activation, which can exceed the profile's
# default slow-test timeout while streaming mailbox payloads on real hardware.
slow-timeout = { period = "5m", terminate-after = 9 }

[profile.nightly-release]
inherits = "emulator"
fail-fast = false
default-filter = """
(package(caliptra-mcu-tests-integration) and test(test_flash_soc_boot_successful)) |
(package(caliptra-mcu-tests-integration) and test(test_defmt_logging_release))
"""

[profile.nightly-ci-spdm]
inherits = "nightly"
default-filter = """
(package(caliptra-mcu-tests-integration) and test(test_mctp_spdm_attestation_pcr_quote)) |
(package(caliptra-mcu-tests-integration) and test(test_mctp_spdm_responder_conformance))
"""

[[profile.nightly-ci-spdm.overrides]]
filter = "package(caliptra-mcu-tests-integration) and test(test_mctp_spdm_responder_conformance)"
# With SPDM 1.4 ML-DSA-87 CHALLENGE and MEASUREMENTS coverage enabled in the
# validator, generating pure ML-DSA signatures and chunked transfers over I3C
# on FPGA hardware exceeds the default 30-minute slow-timeout.
slow-timeout = { period = "5m", terminate-after = 12 }

[profile.pr-emulator]
inherits = "emulator"
fail-fast = false
# Run only short tests (less than 3 mins)
default-filter = """
not (
    test(test_firmware_update_flash_successful) |
    test(test_streaming_boot_flash_write_back) |
    test(test_firmware_update_benchmark_64k) |
    test(test_firmware_update_flash_invalid_soc_image) |
    test(test_firmware_update_flash_invalid_mcu_image) |
    test(test_firmware_update_flash_invalid_manifest) |
    test(test_header_burns_caliptra_runtime_svn) |
    test(test_mctp_user_loopback) |
    test(test_defmt_logging_release)
)
"""
