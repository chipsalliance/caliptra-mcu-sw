[profile.nightly]
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "5m", terminate-after = 6 }

[profile.nightly.junit]
path = "/tmp/junit.xml"
store-success-output = true
store-failure-output = true

[profile.nightly-emulator]
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 30 }
default-filter = "not test(test_defmt_logging_release)"

[profile.nightly-emulator.junit]
path = "/tmp/junit.xml"
store-success-output = true
store-failure-output = true

[profile.nightly-ci]
inherits = "nightly"
# Tests that program OTP with LifecycleControllerState::Dev as the initial
# state hang the FPGA at "Taking subsystem out of reset" (confirmed locally
# with test_lc_dev_to_prod). Dev-init tests are disabled until that's
# root-caused.
default-filter = """
(package(caliptra-mcu-hw-model)
    - test(model_emulated::test::test_new_unbooted)) |
(package(caliptra-mcu-tests-integration) and test(test_i3c_simple)) |
(package(caliptra-mcu-tests-integration) and test(test_mctp_capsule_loopback_after_hitless_update_reset))
"""
# Disabled because they hang the FPGA at boot (LifecycleControllerState::Dev):
#   test_bootfsm_timeout.
# Disabled because they fail on FPGA:
#   test_fw_manifest_dot_hitless_lock, test_log_flash_usermode,
#   test_mctp_capsule_loopback, test_mcu_mbox_cmds,
#   test_mcu_mbox_fips_periodic, test_mcu_mbox_fips_self_test.
# Disabled pre-existing for flakiness:
#   test_firmware_update_streaming_fpga
#   test_rom_hooks_fire_in_order — SIGABRTs from a caliptra-sw hw-model
#     I3C SETDASA timeout (host cfg_initialize() times out, then a
#     poisoned-lock cascade in Drop) when run after the lifecycle tests;
#     tracked upstream. Still runs on the emulator profile.

[[profile.nightly-ci.overrides]]
filter = "package(caliptra-mcu-tests-integration) and test(test_firmware_update_streaming_fpga)"
# FPGA PLDM firmware-update streaming transfers are slow and now also cover
# Measurement API auth-manifest validation before activation. Keep this timeout
# scoped to the single FPGA streaming test instead of relaxing the full profile.
slow-timeout = { period = "5m", terminate-after = 9 }

[[profile.nightly-ci.overrides]]
filter = "package(caliptra-mcu-tests-integration) and test(test_firmware_activate_fpga)"
# This test performs the flash-backed activation path on FPGA hardware. W7 adds
# auth-manifest validation before activation, which can exceed the profile's
# default slow-test timeout while streaming mailbox payloads on real hardware.
slow-timeout = { period = "5m", terminate-after = 9 }

[profile.nightly-release]
inherits = "nightly-emulator"
default-filter = """
(package(caliptra-mcu-tests-integration) and test(test_flash_soc_boot_successful)) |
(package(caliptra-mcu-tests-integration) and test(test_defmt_logging_release))
"""

[profile.nightly-ci-spdm]
inherits = "nightly"
default-filter = """
(package(caliptra-mcu-tests-integration) and test(test_mctp_spdm_attestation)) |
(package(caliptra-mcu-tests-integration) and test(test_mctp_spdm_responder_conformance))
"""
