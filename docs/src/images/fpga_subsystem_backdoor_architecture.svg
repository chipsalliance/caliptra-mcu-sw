<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">FPGA Caliptra Subsystem host and backdoor architecture</title>
  <desc id="desc">An ARM CPU running Linux integration tests accesses the FPGA through UIO and an AXI interconnect. Normal AXI paths reach the FPGA wrapper, Caliptra MMIO, lifecycle controller, OTP controller, MCI, I3C, and flash-controller windows. Dedicated provisioning backdoors write Caliptra ROM, MCU ROM, and OTP backing RAM while the subsystem is held in reset. The MCU and Caliptra cores use normal internal paths after reset is released.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#176b87"/>
    </marker>
    <style>
      .title { font-family: 'DejaVu Sans', sans-serif; font-size: 27px; font-weight: 700; fill: #0f3d5c; }
      .section { font-family: 'DejaVu Sans', sans-serif; font-size: 19px; font-weight: 700; fill: #0f3d5c; }
      .label { font-family: 'DejaVu Sans', sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
      .dark-label { font-family: 'DejaVu Sans', sans-serif; font-size: 15px; font-weight: 700; fill: #17324d; }
      .small { font-family: 'DejaVu Sans', sans-serif; font-size: 14px; fill: #334155; }
      .tiny { font-family: 'DejaVu Sans', sans-serif; font-size: 13px; fill: #334155; }
      .addr { font-family: 'DejaVu Sans Mono', monospace; font-size: 12px; fill: #475569; }
      .host { fill: #176b87; stroke: #0b4f6c; stroke-width: 2; }
      .bridge { fill: #6b7280; stroke: #475569; stroke-width: 2; }
      .normal { fill: #edf7fb; stroke: #176b87; stroke-width: 2; }
      .core { fill: #1f7897; stroke: #0b4f6c; stroke-width: 2; }
      .memory { fill: #fff4e8; stroke: #d07a45; stroke-width: 2; }
      .security { fill: #f2edf7; stroke: #8b6ca8; stroke-width: 2; }
      .normal-path { fill: none; stroke: #176b87; stroke-width: 3; marker-end: url(#arrow-blue); }
      .internal-path { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1500" height="940" fill="#ffffff"/>
  <text x="40" y="44" class="title">FPGA Integration-Test Access and Provisioning Backdoors</text>

  <!-- ARM/Linux host -->
  <rect x="35" y="78" width="300" height="710" fill="#f8fbfd" stroke="#8b6ca8" stroke-width="2"/>
  <text x="185" y="112" text-anchor="middle" class="section">ARM Processing System</text>
  <rect x="65" y="140" width="240" height="72" class="host"/>
  <text x="185" y="170" text-anchor="middle" class="label">Integration Tests</text>
  <text x="185" y="194" text-anchor="middle" class="label">FPGA Hardware Model</text>
  <rect x="65" y="244" width="240" height="65" class="host"/>
  <text x="185" y="273" text-anchor="middle" class="label">Linux UIO Driver</text>
  <text x="185" y="296" text-anchor="middle" class="label">/dev/uio0, /dev/uio1</text>
  <rect x="65" y="344" width="240" height="105" class="bridge"/>
  <text x="185" y="374" text-anchor="middle" class="label">UIO mmap</text>
  <text x="185" y="400" text-anchor="middle" class="label">volatile MMIO</text>
  <text x="185" y="428" text-anchor="middle" class="label">ROM / OTP memcpy</text>
  <path d="M 185 212 V 244" class="normal-path"/>
  <path d="M 185 309 V 344" class="normal-path"/>
  <text x="185" y="493" text-anchor="middle" class="dark-label">Test setup sequence</text>
  <text x="82" y="523" class="small">1. Assert subsystem reset</text>
  <text x="82" y="550" class="small">2. Write ROM and OTP backdoors</text>
  <text x="82" y="577" class="small">3. Program wrapper straps</text>
  <text x="82" y="604" class="small">4. Release reset / power-good</text>
  <text x="82" y="631" class="small">5. Stream or flash-load firmware</text>
  <text x="82" y="658" class="small">6. Run test commands</text>
  <rect x="65" y="700" width="240" height="58" class="security"/>
  <text x="185" y="725" text-anchor="middle" class="dark-label">Debian / PetaLinux</text>
  <text x="185" y="747" text-anchor="middle" class="small">Current repository host assumption</text>

  <!-- AXI bridge -->
  <rect x="385" y="78" width="245" height="710" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="507" y="112" text-anchor="middle" class="section">FPGA Host Bridge</text>
  <rect x="415" y="148" width="185" height="78" class="bridge"/>
  <text x="507" y="179" text-anchor="middle" class="label">PS AXI Manager</text>
  <text x="507" y="204" text-anchor="middle" class="label">M_AXI_FPD</text>
  <rect x="415" y="270" width="185" height="95" class="bridge"/>
  <text x="507" y="304" text-anchor="middle" class="label">AXI</text>
  <text x="507" y="329" text-anchor="middle" class="label">SmartConnect</text>
  <text x="507" y="352" text-anchor="middle" class="label">Address Decode</text>
  <path d="M 335 395 H 375 V 187 H 415" class="normal-path"/>
  <path d="M 507 226 V 270" class="normal-path"/>

  <text x="507" y="435" text-anchor="middle" class="dark-label">Host AXI access</text>
  <text x="507" y="478" text-anchor="middle" class="small">Backdoor memories remain</text>
  <text x="507" y="500" text-anchor="middle" class="small">accessible while subsystem</text>
  <text x="507" y="522" text-anchor="middle" class="small">MMIO is held in reset.</text>

  <!-- Board / subsystem -->
  <rect x="680" y="78" width="785" height="710" fill="#f8fbfd" stroke="#d07a45" stroke-width="2"/>
  <text x="1072" y="112" text-anchor="middle" class="section">FPGA Fabric / Caliptra Subsystem</text>

  <!-- Host-visible normal interfaces -->
  <rect x="710" y="140" width="185" height="68" class="normal"/>
  <text x="802" y="166" text-anchor="middle" class="dark-label">FPGA Wrapper</text>
  <text x="802" y="187" text-anchor="middle" class="addr">0xA401_0000</text>
  <rect x="920" y="140" width="185" height="68" class="normal"/>
  <text x="1012" y="166" text-anchor="middle" class="dark-label">Caliptra MMIO</text>
  <text x="1012" y="187" text-anchor="middle" class="addr">0xA410_0000</text>
  <rect x="1130" y="140" width="145" height="68" class="security"/>
  <text x="1202" y="166" text-anchor="middle" class="dark-label">Lifecycle</text>
  <text x="1202" y="187" text-anchor="middle" class="addr">0xA404_0000</text>
  <rect x="1300" y="140" width="135" height="68" class="security"/>
  <text x="1367" y="166" text-anchor="middle" class="dark-label">OTP Ctrl</text>
  <text x="1367" y="187" text-anchor="middle" class="addr">0xA406_0000</text>

  <rect x="710" y="235" width="185" height="68" class="normal"/>
  <text x="802" y="261" text-anchor="middle" class="dark-label">MCI / MCU Space</text>
  <text x="802" y="282" text-anchor="middle" class="addr">0xA800_0000</text>
  <rect x="920" y="235" width="185" height="68" class="normal"/>
  <text x="1012" y="261" text-anchor="middle" class="dark-label">Subsystem I3C</text>
  <text x="1012" y="282" text-anchor="middle" class="addr">0xA403_0000</text>
  <rect x="1130" y="235" width="305" height="68" class="normal"/>
  <text x="1282" y="261" text-anchor="middle" class="dark-label">External I3C Host + Flash Controls</text>
  <text x="1282" y="282" text-anchor="middle" class="addr">0xA408_0000 / wrapper +0x2000</text>

  <!-- Host AXI enters the FPGA fabric; address decode selects the target. -->
  <path d="M 600 317 H 663" fill="none" stroke="#176b87" stroke-width="3"/>
  <path d="M 663 308 L 680 317 L 663 326 Z" fill="#176b87"/>

  <!-- Backdoor memories -->
  <text x="1072" y="345" text-anchor="middle" class="section">Provisioned Before Reset Release</text>
  <rect x="720" y="370" width="215" height="86" class="memory"/>
  <text x="827" y="398" text-anchor="middle" class="dark-label">Caliptra ROM BRAM</text>
  <text x="827" y="421" text-anchor="middle" class="small">Dual-port backdoor</text>
  <text x="827" y="443" text-anchor="middle" class="addr">0xB000_0000</text>
  <rect x="965" y="370" width="215" height="86" class="memory"/>
  <text x="1072" y="398" text-anchor="middle" class="dark-label">MCU ROM BRAM</text>
  <text x="1072" y="421" text-anchor="middle" class="small">Dual-port backdoor</text>
  <text x="1072" y="443" text-anchor="middle" class="addr">0xB002_0000</text>
  <rect x="1210" y="370" width="215" height="86" class="memory"/>
  <text x="1317" y="398" text-anchor="middle" class="dark-label">OTP Backing RAM</text>
  <text x="1317" y="421" text-anchor="middle" class="small">Test provisioning image</text>
  <text x="1317" y="443" text-anchor="middle" class="addr">0xB008_0000</text>

  <!-- Runtime subsystem blocks -->
  <text x="1072" y="505" text-anchor="middle" class="section">Runtime Hardware Paths</text>
  <rect x="720" y="532" width="215" height="78" class="core"/>
  <text x="827" y="562" text-anchor="middle" class="label">Caliptra RISC-V Core</text>
  <text x="827" y="587" text-anchor="middle" class="label">ROM / Runtime</text>
  <rect x="965" y="532" width="215" height="78" class="core"/>
  <text x="1072" y="562" text-anchor="middle" class="label">MCU RISC-V Core</text>
  <text x="1072" y="587" text-anchor="middle" class="label">ROM / Runtime</text>
  <rect x="1210" y="532" width="215" height="78" class="security"/>
  <text x="1317" y="562" text-anchor="middle" class="dark-label">Lifecycle + OTP</text>
  <text x="1317" y="587" text-anchor="middle" class="dark-label">Security State</text>

  <path d="M 827 456 V 532" class="internal-path"/>
  <path d="M 1072 456 V 532" class="internal-path"/>
  <path d="M 1317 456 V 532" class="internal-path"/>

  <rect x="720" y="648" width="705" height="52" class="bridge"/>
  <text x="1072" y="681" text-anchor="middle" class="label">Caliptra Subsystem Internal Interconnect</text>
  <path d="M 827 610 V 648 M 1072 610 V 648 M 1317 610 V 648" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <rect x="720" y="728" width="335" height="48" class="normal"/>
  <text x="887" y="758" text-anchor="middle" class="dark-label">Mailbox / Recovery I/F</text>
  <rect x="1090" y="728" width="335" height="48" class="normal"/>
  <text x="1257" y="758" text-anchor="middle" class="dark-label">MCI / SRAM / DMA</text>
  <path d="M 887 700 V 728 M 1257 700 V 728" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <!-- Legend -->
  <text x="45" y="841" class="dark-label">Path legend</text>
  <line x1="45" y1="870" x2="135" y2="870" class="normal-path"/>
  <text x="150" y="875" class="small">Normal AXI / MMIO</text>
  <rect x="330" y="854" width="54" height="30" class="memory"/>
  <text x="400" y="875" class="small">Provisioning memory</text>
  <text x="45" y="915" class="tiny">Backdoor writes occur while reset is asserted. Normal subsystem interfaces become active after reset and power-good are released.</text>
</svg>
