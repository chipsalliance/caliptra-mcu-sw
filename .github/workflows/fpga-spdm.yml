name: FPGA SPDM Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact-suffix:
        description: Suffix to distinguish artifacts within a shared workflow run
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-fpga-spdm-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revision_2_1:
    if: ${{ vars.RUN_FPGA_CI != 'false' }}
    uses: ./.github/workflows/fpga-spdm-revision.yml
    with:
      hw-revision: "2.1"
    secrets: inherit

  revision_latest:
    if: ${{ vars.RUN_FPGA_CI != 'false' }}
    uses: ./.github/workflows/fpga-spdm-revision.yml
    with:
      hw-revision: "latest"
    secrets: inherit

  test_spdm:
    if: always()
    runs-on: ubuntu-latest
    needs: [revision_2_1, revision_latest]
    steps:
      - name: Require both revision SPDM tests
        env:
          RESULT_2_1: ${{ needs.revision_2_1.result }}
          RESULT_LATEST: ${{ needs.revision_latest.result }}
          RUN_FPGA_CI: ${{ vars.RUN_FPGA_CI }}
        run: |
          if [[ "$RUN_FPGA_CI" == "false" && "$RESULT_2_1" == "skipped" && "$RESULT_LATEST" == "skipped" ]]; then
            exit 0
          fi
          [[ "$RESULT_2_1" == "success" && "$RESULT_LATEST" == "success" ]]
