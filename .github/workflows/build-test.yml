name: Build and Test

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Run daily at 02:00 UTC (nightly)
    - cron: '0 2 * * *'

env:
  # Pin the Caliptra core ROM to a release tag; image/update crates continue
  # to use the Cargo.toml caliptra-sw rev. main-2.1 pins rom-2.1.2 instead.
  CALIPTRA_ROM_REF: rom-2.1.2
  RUSTUP_TOOLCHAIN: "1.85-x86_64-unknown-linux-gnu"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-xtask:
    runs-on: e2-standard-4
    timeout-minutes: 30

    env:
      CARGO_INCREMENTAL: 0
      EXTRA_CARGO_CONFIG: 'target.''cfg(all())''.rustflags = ["-Dwarnings"]'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install required packages
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential curl git libclang-dev llvm && \
          rustup toolchain install 1.85-x86_64-unknown-linux-gnu -c clippy,rust-src,llvm-tools,llvm-tools-preview,rustfmt,rustc-dev -t riscv32imc-unknown-none-elf,aarch64-unknown-linux-gnu

      - name: Prebuild xtask
        run: |
          cargo build --package caliptra-mcu-xtask --features parallel-build
          cp target/debug/caliptra-mcu-xtask /tmp/xtask

      - name: Upload xtask binary
        uses: actions/upload-artifact@v4
        with:
          name: xtask-binary
          path: /tmp/xtask
          retention-days: 1

  precheckin:
    runs-on: e2-standard-8
    needs: [build-xtask]
    timeout-minutes: 45

    env:
      CARGO_INCREMENTAL: 0
      EXTRA_CARGO_CONFIG: 'target.''cfg(all())''.rustflags = ["-Dwarnings"]'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test commit name
        run: |
          echo "Lint: release_ref=$(git rev-parse HEAD)"

      - name: Install required packages
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential curl git libclang-dev llvm && \
          rustup toolchain install 1.85-x86_64-unknown-linux-gnu -c clippy,rust-src,llvm-tools,llvm-tools-preview,rustfmt,rustc-dev -t riscv32imc-unknown-none-elf,aarch64-unknown-linux-gnu

      - name: Download xtask binary
        uses: actions/download-artifact@v4
        with:
          name: xtask-binary
          path: /tmp/

      - name: Make xtask executable
        run: chmod +x /tmp/xtask

      - name: Install cargo-nextest (prebuilt binary)
        run: |
          curl -LsSf https://get.nexte.st/0.9.118/linux | tar zxf - -C ~/.cargo/bin

      - name: Run precheckin
        run: /tmp/xtask precheckin

  build-firmware:
    runs-on: e2-standard-16-big-disk
    needs: [build-xtask]
    # Changes to shared userspace code invalidate every feature-specific runtime;
    # a cold rebuild can exceed one hour before the release bundle is packaged.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]

    env:
      CARGO_INCREMENTAL: 0
      EXTRA_CARGO_CONFIG: 'target.''cfg(all())''.rustflags = ["-Dwarnings"]'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install required packages
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential curl git libclang-dev llvm && \
          rustup toolchain install 1.85-x86_64-unknown-linux-gnu -c clippy,rust-src,llvm-tools,llvm-tools-preview,rustfmt,rustc-dev -t riscv32imc-unknown-none-elf,aarch64-unknown-linux-gnu

      - name: Download xtask binary
        uses: actions/download-artifact@v8
        with:
          name: xtask-binary
          path: /tmp/

      - name: Make xtask executable
        run: chmod +x /tmp/xtask

      - name: Build ROM and runtime binaries (Shard ${{ matrix.shard }}/5)
        run: |
          /tmp/xtask all-build --platform emulator \
            --rom-features "hw-2-1" \
            --test-rom-features "ocp-lock,stable-owner-key,test-network-boot" \
            --network-rom-features "network-boot" \
            --separate-runtimes \
            --shard-index ${{ matrix.shard }} \
            --total-shards 5

      - name: Build release ROM and runtime binaries (Shard ${{ matrix.shard }}/5)
        run: |
          /tmp/xtask all-build \
            --platform emulator --separate-runtimes \
            --profile release \
            --shard-index ${{ matrix.shard }} \
            --total-shards 5

      - name: Upload partial firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bundle-shard-${{ matrix.shard }}
          path: target/all-fw*.zip
          retention-days: 1

  merge-firmware-bundles:
    needs: build-firmware
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install zip/unzip tools
        run: sudo apt-get update -qy && sudo apt-get install -qy zip unzip

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-bundle-shard-*
          path: staging/

      - name: Merge firmware bundles
        run: |
          mkdir -p target/merged-all-fw target/merged-all-fw-release
          for shard_dir in staging/firmware-bundle-shard-*; do
            if [ -f "$shard_dir"/all-fw-shard-*.zip ]; then
              unzip -o "$shard_dir"/all-fw-shard-*.zip -d target/merged-all-fw/
            fi
            if [ -f "$shard_dir"/all-fw-release-shard-*.zip ]; then
              unzip -o "$shard_dir"/all-fw-release-shard-*.zip -d target/merged-all-fw-release/
            fi
          done

          cd target/merged-all-fw && zip -r ../all-fw.zip . && cd -
          cd target/merged-all-fw-release && zip -r ../all-fw-release.zip . && cd -

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v7
        with:
          name: firmware-bundle
          path: target/all-fw.zip
          retention-days: 1

      - name: Upload release firmware bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-firmware-bundle
          path: target/all-fw-release.zip
          retention-days: 1

  build-emulator:
    runs-on: e2-standard-16
    needs: [build-xtask]
    timeout-minutes: 60

    env:
      CARGO_INCREMENTAL: 0
      EXTRA_CARGO_CONFIG: 'target.''cfg(all())''.rustflags = ["-Dwarnings"]'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install required packages
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential curl git libclang-dev llvm && \
          rustup toolchain install 1.85-x86_64-unknown-linux-gnu -c clippy,rust-src,llvm-tools,llvm-tools-preview,rustfmt,rustc-dev -t riscv32imc-unknown-none-elf,aarch64-unknown-linux-gnu

      - name: Download xtask binary
        uses: actions/download-artifact@v8
        with:
          name: xtask-binary
          path: /tmp/

      - name: Make xtask executable
        run: chmod +x /tmp/xtask

      - name: Build emulator binary
        run: |
          # Build a single emulator that supports all test features via runtime flags
          /tmp/xtask emulator-build

      - name: Upload emulator bundle
        uses: actions/upload-artifact@v7
        with:
          name: emulator-bundle
          path: target/emulators.zip
          retention-days: 1

  build-tests:
    runs-on: e2-standard-8
    needs: [build-xtask]
    timeout-minutes: 60

    env:
      CARGO_INCREMENTAL: 0
      EXTRA_CARGO_CONFIG: 'target.''cfg(all())''.rustflags = ["-Dwarnings"]'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test commit name
        run: |
          echo "Build tests: release_ref=$(git rev-parse HEAD)"

      - name: Install required packages
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential curl git libclang-dev llvm && \
          rustup toolchain install 1.85-x86_64-unknown-linux-gnu -c clippy,rust-src,llvm-tools,llvm-tools-preview,rustfmt,rustc-dev -t riscv32imc-unknown-none-elf,aarch64-unknown-linux-gnu

      - name: Install cargo-nextest (prebuilt binary)
        run: |
          curl -LsSf https://get.nexte.st/0.9.118/linux | tar zxf - -C ~/.cargo/bin

      - name: Download xtask binary
        uses: actions/download-artifact@v8
        with:
          name: xtask-binary
          path: /tmp/

      - name: Make xtask executable
        run: chmod +x /tmp/xtask

      - name: Build test archive
        run: |
          /tmp/xtask test-archive \
            --archive /tmp/nextest-archive.tar.zst

      - name: Upload test archive
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: /tmp/nextest-archive.tar.zst
          retention-days: 1

  test_emulator:
    runs-on: e2-standard-4
    needs: [precheckin, merge-firmware-bundles, build-emulator, build-tests, build-xtask]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      CARGO_INCREMENTAL: 0
      EXTRA_CARGO_CONFIG: 'target.''cfg(all())''.rustflags = ["-Dwarnings"]'
      NEXTEST_PROFILE: ${{ github.event_name == 'schedule' && 'emulator' || 'pr-emulator' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install required packages
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential curl git libclang-dev llvm dnsmasq && \
          rustup toolchain install 1.85-x86_64-unknown-linux-gnu -c clippy,rust-src,llvm-tools,llvm-tools-preview,rustfmt,rustc-dev -t riscv32imc-unknown-none-elf,aarch64-unknown-linux-gnu

      - name: Install cargo-nextest (prebuilt binary)
        run: |
          curl -LsSf https://get.nexte.st/0.9.118/linux | tar zxf - -C ~/.cargo/bin

      - name: Download xtask binary
        uses: actions/download-artifact@v4
        with:
          name: xtask-binary
          path: /tmp/

      - name: Make xtask executable
        run: chmod +x /tmp/xtask

      - name: Setup TAP interface for network tests
        run: |
          /tmp/xtask network tap setup

      - name: Download firmware bundle
        uses: actions/download-artifact@v8
        with:
          name: firmware-bundle
          path: target/

      - name: Download release firmware bundle
        uses: actions/download-artifact@v8
        with:
          name: release-firmware-bundle
          path: target/

      - name: Download emulator bundle
        uses: actions/download-artifact@v8
        with:
          name: emulator-bundle
          path: target/

      - name: Download test archive
        uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: /tmp/

      # To run these tests locally for debugging, first build the firmware and emulators:
      #   cargo xtask all-build --platform emulator --separate-runtimes
      #   cargo xtask emulator-build
      # Then run the tests with:
      #   cargo xtask test --firmware-bundle target/all-fw.zip --emulator-bundle target/emulators.zip
      - name: Run tests (shard ${{ matrix.shard }}/8)
        run: |
          /tmp/xtask test \
            --archive /tmp/nextest-archive.tar.zst \
            --shard hash:${{ matrix.shard }}/8 \
            --firmware-bundle "${PWD}/target/all-fw.zip" \
            --emulator-bundle "${PWD}/target/emulators.zip" \
            --workspace-remap . \
            --nextest-profile "${{ env.NEXTEST_PROFILE }}"

      - name: Move devel junit xml
        if: success() || failure()
        run: |
          sudo mv /tmp/junit.xml /tmp/junit-${{ matrix.shard }}.xml

      - name: Run release tests
        if: matrix.shard == 1
        run: |
          /tmp/xtask test \
            --archive /tmp/nextest-archive.tar.zst \
            --firmware-bundle "${PWD}/target/all-fw-release.zip" \
            --emulator-bundle "${PWD}/target/emulators.zip" \
            --workspace-remap . \
            --nextest-profile nightly-release

      - name: Move release junit xml
        if: (success() || failure()) && matrix.shard == 1
        run: |
          sudo mv /tmp/junit.xml /tmp/junit-release.xml

      - name: 'Upload test results'
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: caliptra-test-results-${{ matrix.shard }}
          path: |
            /tmp/junit-${{ matrix.shard }}.xml
            /tmp/junit-release.xml
          retention-days: 1

  print_test_results:
    runs-on: ubuntu-latest
    needs: [test_emulator]
    if: always()
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 'Download test results'
        uses: actions/download-artifact@v8
        with:
          pattern: caliptra-test-results-*
          merge-multiple: true
          path: /tmp/junit

      - name: Install test-printer
        run: |
          cargo install --git https://github.com/chipsalliance/caliptra-infra test-printer --root /tmp/test-printer

      - name: Print results
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          for xml in /tmp/junit/junit-*.xml; do
            /tmp/test-printer/bin/test-printer --xml-path "$xml" >> $GITHUB_STEP_SUMMARY
          done

  coverage:
    runs-on: ubuntu-latest
    needs: [precheckin, merge-firmware-bundles, build-emulator, build-tests, build-xtask]

    env:
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install required packages
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential curl git libclang-dev llvm && \
          rustup toolchain install 1.85-x86_64-unknown-linux-gnu -c clippy,rust-src,llvm-tools,llvm-tools-preview,rustfmt,rustc-dev -t riscv32imc-unknown-none-elf,aarch64-unknown-linux-gnu

      - name: Install cargo-nextest (prebuilt binary)
        run: |
          curl -LsSf https://get.nexte.st/0.9.118/linux | tar zxf - -C ~/.cargo/bin

      - name: Download xtask binary
        uses: actions/download-artifact@v4
        with:
          name: xtask-binary
          path: /tmp/

      - name: Make xtask executable
        run: chmod +x /tmp/xtask

      - name: Download firmware bundle
        uses: actions/download-artifact@v8
        with:
          name: firmware-bundle
          path: target/

      - name: Download emulator bundle
        uses: actions/download-artifact@v8
        with:
          name: emulator-bundle
          path: target/

      - name: Download test archive
        uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: /tmp/

      - name: Build ROM ELF for coverage analysis
        run: /tmp/xtask rom-build

      - name: Run tests with coverage collection
        run: |
          mkdir -p /tmp/mcu-coverage
          CPTRA_FIRMWARE_BUNDLE="${PWD}/target/all-fw.zip" \
          CPTRA_EMULATOR_BUNDLE="${PWD}/target/emulators.zip" \
          MCU_COVERAGE_PATH=/tmp/mcu-coverage \
          cargo nextest run \
            --archive-file /tmp/nextest-archive.tar.zst \
            --workspace-remap . \
            -E 'not (test(test_firmware_update) | test(test_soc_boot) | test(test_dot::test::test_fw_manifest) | test(test_dot::test::test_dot_fuse) | test(test_new_unbooted))' \
            || true

      - name: Analyze coverage
        run: |
          MCU_COVERAGE_PATH=/tmp/mcu-coverage /tmp/xtask coverage --analyze-only 2>&1 | tee /tmp/coverage-results.txt
          echo '## Code Coverage' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '| Image | Metric | Value |' >> $GITHUB_STEP_SUMMARY
          echo '|-------|--------|-------|' >> $GITHUB_STEP_SUMMARY
          grep -E "^(MCU ROM Coverage|ICCM/SRAM Coverage|Instruction count|Coverage =|Bits set)" /tmp/coverage-results.txt | \
          awk '
            /MCU ROM Coverage/ { image="MCU ROM" }
            /ICCM\/SRAM Coverage/ { match($0, /tag=[0-9]+/); image="ICCM/SRAM " substr($0, RSTART, RLENGTH) }
            /Instruction count/ { print "| " image " | Instructions | " $NF " |" }
            /Coverage =/ { print "| " image " | Coverage | " $NF " |" }
            /Bits set =/ { for(i=1;i<=NF;i++){if($i=="=")a=$((i+1)); if($i=="/")b=$((i+1)); if($i~/\(/){p=$i}} print "| " image " | Bits set | " a " / " b " " p " |" }
          ' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '_Full details in build log. Uncovered function list omitted from summary._' >> $GITHUB_STEP_SUMMARY
