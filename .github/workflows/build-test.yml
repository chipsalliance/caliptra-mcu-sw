name: Build and Test

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revision_2_1:
    uses: ./.github/workflows/build-test-revision.yml
    with:
      hw-revision: "2.1"
    secrets: inherit

  revision_latest:
    uses: ./.github/workflows/build-test-revision.yml
    with:
      hw-revision: "latest"
    secrets: inherit

  precheckin:
    if: always()
    runs-on: ubuntu-latest
    needs: [revision_2_1, revision_latest]
    steps:
      - name: Require both revision precheckins
        env:
          RESULT_2_1: ${{ needs.revision_2_1.outputs.precheckin-result }}
          RESULT_LATEST: ${{ needs.revision_latest.outputs.precheckin-result }}
        run: test "$RESULT_2_1" = success && test "$RESULT_LATEST" = success

  test_emulator:
    if: always()
    runs-on: ubuntu-latest
    needs: [revision_2_1, revision_latest]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Require all revision and shard tests
        env:
          RESULT_2_1: ${{ needs.revision_2_1.outputs.emulator-result }}
          RESULT_LATEST: ${{ needs.revision_latest.outputs.emulator-result }}
        run: test "$RESULT_2_1" = success && test "$RESULT_LATEST" = success
