name: FPGA Bitstream build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bitstream:
    runs-on: [bitstream-builder]
    timeout-minutes: 1440
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create segmented subsystem bitstream
        env:
          STAGING_DIR: ${{ runner.temp }}/pr2136-bitstream
        run: |
          set -euo pipefail
          source /vck190-tools/Vivado/2024.2/settings64.sh
          mkdir -p "$STAGING_DIR"
          git rev-parse HEAD > "$STAGING_DIR/source-commit.txt"
          git submodule status --recursive > "$STAGING_DIR/submodules.txt"
          cd hw/fpga
          /vck190-tools/Vivado/2024.2/bin/vivado -mode batch -source fpga_configuration.tcl -tclargs BUILD=TRUE SEGMENTED=true
          cp caliptra_build/*.xsa "$STAGING_DIR/"
          cp caliptra_build/*.pdi "$STAGING_DIR/"
          (cd "$STAGING_DIR" && sha256sum *.xsa *.pdi > SHA256SUMS)

      - name: Upload validation bitstream
        uses: actions/upload-artifact@v7
        with:
          name: pr2136-segmented-bitstream
          path: ${{ runner.temp }}/pr2136-bitstream/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Vivado logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr2136-vivado-logs
          path: |
            hw/fpga/vivado.log
            hw/fpga/caliptra_build/**/*.log
            hw/fpga/caliptra_build/**/*.rpt
          retention-days: 7
