name: FPGA Bitstream build

on:
  workflow_call:
    inputs:
      hw-version:
        description: Hardware version recorded in the bitstream manifest
        required: true
        type: string
      repository:
        description: Repository to check out and record in the manifest
        required: true
        type: string
      ref:
        description: Commit SHA, branch or tag to build
        required: true
        type: string
      fpga-path:
        description: FPGA build directory relative to the checkout
        required: true
        type: string
      rtl-path:
        description: Caliptra subsystem submodule path relative to the checkout
        required: true
        type: string
      target-branch:
        description: Target branch recorded in the manifest
        required: true
        type: string

jobs:
  build-bitstream:
    runs-on: [bitstream-builder]
    timeout-minutes: 1440
    strategy:
      matrix:
        segmented: [true, false]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: 'recursive'

      - name: Create Subsystem bitstream
        env:
          STAGING_DIR: ${{ runner.temp }}/bitstream
          FPGA_PATH: ${{ inputs.fpga-path }}
        run: |
          source /vck190-tools/Vivado/2024.2/settings64.sh
          mkdir -p "$STAGING_DIR"
          cd "$FPGA_PATH"
          /vck190-tools/Vivado/2024.2/bin/vivado -mode batch -source fpga_configuration.tcl -tclargs BUILD=TRUE SEGMENTED=${{ matrix.segmented }}
          cp caliptra_build/*.xsa "$STAGING_DIR/"
          shopt -s nullglob
          PDI_FILES=(caliptra_build/*.pdi)
          if [ "${#PDI_FILES[@]}" -gt 0 ]; then
            cp "${PDI_FILES[@]}" "$STAGING_DIR/"
          fi

      - name: 'Upload bitstream'
        uses: actions/upload-artifact@v7
        with:
          name: caliptra-bitstream-${{ inputs.hw-version }}-${{ matrix.segmented }}
          path: |
            ${{ runner.temp }}/bitstream/*.xsa
            ${{ runner.temp }}/bitstream/*.pdi
          retention-days: 7

      - name: Bundle bitstream
        env:
          STAGING_DIR: ${{ runner.temp }}/bitstream
          RTL_PATH: ${{ inputs.rtl-path }}
          REPOSITORY: ${{ inputs.repository }}
          HW_VERSION: ${{ inputs.hw-version }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          SS_COMMIT=$(git -C "$RTL_PATH" rev-parse HEAD)
          EXTRA_ARGS=()
          if [ "${{ matrix.segmented }}" = "true" ]; then
            EXTRA_ARGS+=(--segmented)
          fi
          if [ -n "$PR_NUMBER" ]; then
            EXTRA_ARGS+=(--github-pr "$PR_NUMBER")
          fi

          shopt -s nullglob
          XSA_FILES=("$STAGING_DIR"/*.xsa)
          PDI_FILES=("$STAGING_DIR"/*.pdi)

          if [ "${#XSA_FILES[@]}" -eq 0 ]; then
            echo "Error: no .xsa file produced by the bitstream build"
            exit 1
          fi

          if [ "${#PDI_FILES[@]}" -gt 0 ]; then
            EXTRA_ARGS+=(--pdi-file "${PDI_FILES[0]}")
          fi

          # The bundle is left in the checkout (inside the runner's _work volume)
          # so the host-side post-job hook can find it and upload it to GCS.
          mkdir manifest-bundle

          caliptra-bitstream-downloader bundle-manifest \
            --repository "$REPOSITORY" \
            --hw-major-version "$HW_VERSION" \
            --target-branch "$TARGET_BRANCH" \
            --caliptra-variant "subsystem" \
            --commit-hash "$COMMIT" \
            --caliptra-ss-commit "$SS_COMMIT" \
            --job-id "${{ github.run_id }}-${{ github.job }}" \
            "${EXTRA_ARGS[@]}" \
            --xsa-file "${XSA_FILES[0]}" \
            --output-dir manifest-bundle

      - name: 'Upload bitstream bundle'
        uses: actions/upload-artifact@v7
        with:
          name: caliptra-bitstream-bundle-${{ inputs.hw-version }}-${{ matrix.segmented && 'segmented' || 'standard' }}
          path: manifest-bundle/caliptra-bitstream.tar.gz
          retention-days: 7

      # Both matrix jobs would otherwise upload a manifest to the same GCS path
      # (v1/<sha>/manifest.toml); only the segmented build is used by the FPGA CI.
      - name: Clean up bundle for non-segmented build
        if: matrix.segmented == false
        run: rm -rf manifest-bundle
