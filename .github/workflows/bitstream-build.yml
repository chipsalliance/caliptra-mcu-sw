name: FPGA Bitstream build

on:
  workflow_dispatch:
    inputs:
      board:
        description: FPGA board to build (non-bootable all-zero firmware)
        type: choice
        options:
          - htg940
        default: htg940

jobs:
  build-htg940:
    uses: ./.github/workflows/bitstream-build-htg940.yml
