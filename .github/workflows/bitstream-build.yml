name: FPGA Bitstream build

on:
  pull_request:
    paths:
      - ".github/workflows/bitstream-build.yml"
      - "hw/fpga/**/*.tcl"
      - "hw/fpga/src/**"
      - "hw/caliptra-ss/**"
      - "hw/*.rdl"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-bitstream:
    runs-on: [bitstream-builder]
    timeout-minutes: 1440
    strategy:
      matrix:
        segmented: [true, false]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Create Subsystem bitstream
        env:
          STAGING_DIR: ${{ runner.temp }}/bitstream
        run: |
          source /vck190-tools/Vivado/2024.2/settings64.sh
          mkdir -p "$STAGING_DIR"
          cd hw/fpga/
          /vck190-tools/Vivado/2024.2/bin/vivado -mode batch -source fpga_configuration.tcl -tclargs BUILD=TRUE SEGMENTED=${{ matrix.segmented }}
          cp caliptra_build/*.xsa "$STAGING_DIR/" || true
          cp caliptra_build/*.pdi "$STAGING_DIR/" || true

      - name: 'Upload bitstream'
        uses: actions/upload-artifact@v7
        with:
          name: caliptra-bitstream-${{ matrix.segmented }}
          path: |
            ${{ runner.temp }}/bitstream/*.xsa
            ${{ runner.temp }}/bitstream/*.pdi
          retention-days: 7

      - name: Bundle bitstream
        env:
          STAGING_DIR: ${{ runner.temp }}/bitstream
        run: |
          SS_COMMIT=$(git submodule status hw/caliptra-ss | awk '{print $1}' | tr -d '+-')
          SEGMENTED_ARG=""
          if [ "${{ matrix.segmented }}" = "true" ]; then
            SEGMENTED_ARG="--segmented"
          fi

          # Find the xsa and pdi files in the staging directory
          XSA_FILE=$(ls "$STAGING_DIR"/*.xsa 2>/dev/null | head -n 1)
          PDI_FILE=$(ls "$STAGING_DIR"/*.pdi 2>/dev/null | head -n 1)

          if [ -z "$XSA_FILE" ]; then
            echo "Error: no .xsa file produced by the bitstream build"
            exit 1
          fi

          PDI_ARG=""
          if [ -n "$PDI_FILE" ]; then
            PDI_ARG="--pdi-file $PDI_FILE"
          fi

          # The bundle is left in the checkout (inside the runner's _work volume)
          # so the host-side post-job hook can find it and upload it to GCS.
          mkdir manifest-bundle

          caliptra-bitstream-downloader bundle-manifest \
            --repository "${{ github.repository }}" \
            --hw-major-version "2.0" \
            --target-branch "${{ github.base_ref || github.ref_name }}" \
            --caliptra-variant "subsystem" \
            --commit-hash "${{ github.sha }}" \
            --caliptra-ss-commit "$SS_COMMIT" \
            --job-id "${{ github.run_id }}-${{ github.job }}" \
            $SEGMENTED_ARG \
            ${{ github.event.pull_request.number && format('--github-pr {0}', github.event.pull_request.number) || '' }} \
            --xsa-file "$XSA_FILE" \
            $PDI_ARG \
            --output-dir manifest-bundle

      - name: 'Upload bitstream bundle'
        uses: actions/upload-artifact@v7
        with:
          name: caliptra-bitstream-bundle-${{ matrix.segmented && 'segmented' || 'standard' }}
          path: manifest-bundle/caliptra-bitstream.tar.gz
          retention-days: 7

      # Both matrix jobs would otherwise upload a manifest to the same GCS path
      # (v1/<sha>/manifest.toml); only the segmented build is used by the FPGA CI.
      - name: Clean up bundle for non-segmented build
        if: matrix.segmented == false
        run: rm -rf manifest-bundle
