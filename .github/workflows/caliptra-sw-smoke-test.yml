name: Caliptra SW Smoke Test (Optional)

on:
  pull_request:
  workflow_dispatch:

jobs:
  caliptra-sw-mcu-rom-smoke-test:
    if: ${{ vars.RUN_FPGA_CI != 'false' }}
    name: Smoke Test (Optional)
    uses: chipsalliance/caliptra-sw/.github/workflows/fpga-subsystem.yml@main
    with:
      mcu-commit: ${{ github.event.pull_request.head.sha || github.sha }}
      branch: main
      # Match main-2.1's CALIPTRA_ROM_REF pin while using the current test harness.
      rom-version: "2.1.2"
      fpga-itrng: true
      extra-features: itrng,ocp-lock
