name: Caliptra SW Smoke Test (Optional)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  caliptra-sw-mcu-rom-smoke-test:
    if: ${{ vars.RUN_FPGA_CI != 'false' }}
    name: Smoke Test 2.1 (Optional)
    uses: chipsalliance/caliptra-sw/.github/workflows/fpga-subsystem.yml@main
    with:
      mcu-commit: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact-suffix: -hw-2.1
      branch: main
      hw-version: "2.1"
      rom-version: "2.1.2"
      fpga-itrng: true
      extra-features: itrng,ocp-lock

  caliptra-sw-mcu-rom-smoke-test-2-2:
    if: ${{ vars.RUN_FPGA_CI != 'false' }}
    name: Smoke Test 2.2 (Optional)
    uses: chipsalliance/caliptra-sw/.github/workflows/fpga-subsystem.yml@caliptra-2.2-dev
    with:
      mcu-commit: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact-suffix: -hw-2.2
      branch: caliptra-2.2-dev
      hw-version: "2.2"
      rom-version: "latest"
      fpga-itrng: true
      extra-features: itrng,ocp-lock
