name: Caliptra SW Smoke Test (Optional)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  caliptra-sw-mcu-rom-smoke-test:
    # Upstream MCU revision selection must be fixed before restoring 2.1 smoke (#2288).
    if: ${{ vars.RUN_FPGA_CI != 'false' && vars.RUN_FPGA_LATEST_CI == 'true' }}
    name: Smoke Test (Optional)
    uses: chipsalliance/caliptra-sw/.github/workflows/fpga-subsystem.yml@main
    with:
      mcu-commit: ${{ github.event.pull_request.head.sha || github.sha }}
      branch: main
      # Match main-2.1's CALIPTRA_ROM_REF pin while using the current test harness.
      rom-version: "2.1.2"
      fpga-itrng: true
      extra-features: itrng,ocp-lock
