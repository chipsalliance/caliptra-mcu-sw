name: Nightly Workflows

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  revision_2_1:
    uses: ./.github/workflows/nightly-revision.yml
    with:
      hw-revision: "2.1"
    secrets: inherit

  revision_latest:
    uses: ./.github/workflows/nightly-revision.yml
    with:
      hw-revision: "latest"
    secrets: inherit
