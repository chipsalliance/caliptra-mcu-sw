name: SPDM Validator Tests

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  workflow_call:
    inputs:
      tools-only:
        description: Build shared spdm-emu tools without running current-image suites
        type: boolean
        default: false
      artifact-suffix:
        description: Suffix for shared tool artifacts
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}${{ inputs.artifact-suffix }}
  cancel-in-progress: false

env:
  # Pin the Caliptra core ROM to a release tag; image/update crates continue
  # to use the Cargo.toml caliptra-sw rev. main-2.1 pins rom-2.1.2 instead.
  CALIPTRA_ROM_REF: rom-2.1.2
  CARGO_BUILD_JOBS: "2"
  RAYON_NUM_THREADS: "2"

jobs:
  build_spdm_emu_tools:
    name: Build spdm-emu tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout workflow build settings
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/spdm-validator.yml
          sparse-checkout-cone-mode: false
      - name: Install required packages
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential gcc-multilib git

      - name: Install cmake 3.x
        run: |
          wget https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz &&
          mkdir -p /opt/cmake &&
          tar xvzf cmake-3.31.6-linux-x86_64.tar.gz -C /opt/cmake --strip-components=1 &&
          echo "/opt/cmake/bin" >> $GITHUB_PATH

      - name: Checkout spdm-emu repository
        uses: actions/checkout@v7
        with:
          repository: chipsalliance/caliptra-spdm-emu
          ref: caliptra-main-14
          path: spdm-emu
          submodules: recursive

      - name: Resolve spdm-emu build inputs
        id: spdm_emu_inputs
        run: |
          set -euo pipefail
          echo "source=$(git -C spdm-emu rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fingerprint="$({ gcc --version; cmake --version; } | sha256sum | cut -d' ' -f1)"
          echo "toolchain=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache spdm-emu tools
        id: spdm_emu_cache
        uses: actions/cache@v6
        with:
          path: spdm-emu/build/bin/
          key: spdm-emu-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.spdm_emu_inputs.outputs.source }}-${{ steps.spdm_emu_inputs.outputs.toolchain }}-${{ hashFiles('.github/workflows/spdm-validator.yml') }}

      - name: Build spdm-emu tools
        if: steps.spdm_emu_cache.outputs.cache-hit != 'true'
        run: |
          pushd spdm-emu
          git submodule update --init --recursive
          find . -path '*/openssllib/CMakeLists.txt' -exec sed -i \
            -e 's/set(OPENSSL_SHARED_OPTION "shared")/set(OPENSSL_SHARED_OPTION "no-shared")/' \
            -e 's/set(OPENSSL_LIBRARY_TYPE "SHARED")/set(OPENSSL_LIBRARY_TYPE "STATIC")/' {} +
          mkdir build
          pushd build
          cmake -DARCH=x64 -DTOOLCHAIN=GCC -DTARGET=Debug -DCRYPTO=openssl -DCMAKE_C_FLAGS="-DLIBSPDM_MAX_CERT_CHAIN_SIZE=0x10000 -DLIBSPDM_MAX_MEASUREMENT_RECORD_SIZE=0x10000" ..
          make copy_sample_key
          make
          popd
          popd

      - name: Package spdm-emu tools
        run: |
          test -x spdm-emu/build/bin/spdm_device_validator_sample
          test -x spdm-emu/build/bin/spdm_requester_emu
          git -C spdm-emu rev-parse HEAD | tee spdm-emu/build/bin/spdm-emu-revision.txt
          tar -czf "${RUNNER_TEMP}/spdm-emu-tools.tar.gz" -C spdm-emu build/bin

      - name: Upload spdm-emu tools
        uses: actions/upload-artifact@v7
        with:
          name: spdm-emu-tools${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}/spdm-emu-tools.tar.gz
          retention-days: 1

  build_spdm_rs_tools:
    if: ${{ !inputs.tools-only }}
    name: Build spdm-rs tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      GIT_TERMINAL_PROMPT: "0"
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/
      GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
      GIT_CONFIG_VALUE_1: "git@github.com:"
      CARGO_INCREMENTAL: 0
      SCCACHE_VERSION: 0.8.2
      SCCACHE_GHA_CACHE_TO: sccache-caliptra-mcu-sw
      SCCACHE_GHA_CACHE_FROM: sccache-caliptra-mcu-sw

      # Change this to a new random value if you suspect the cache is corrupted
      SCCACHE_C_CUSTOM_CACHE_BUSTER: 8b42a6e70ec4

    steps:
      - name: Checkout workflow build settings
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/spdm-validator.yml
          sparse-checkout-cone-mode: false
      - name: Checkout CCC spdm-rs repository
        uses: actions/checkout@v7
        with:
          repository: chipsalliance/caliptra-spdm-rs
          ref: caliptra-0.5.2
          path: spdm-rs
          submodules: recursive

      - name: Install required packages
        working-directory: spdm-rs
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential curl git rustup &&
          rustup toolchain install --profile minimal

      - name: Resolve spdm-rs build inputs
        id: spdm_rs_inputs
        working-directory: spdm-rs
        run: |
          set -euo pipefail
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fingerprint="$({ rustc -Vv; gcc --version; } | sha256sum | cut -d' ' -f1)"
          echo "toolchain=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache spdm-rs tools
        id: spdm_rs_cache
        uses: actions/cache@v6
        with:
          path: |
            spdm-rs/target/debug/spdm-requester-emu
            spdm-rs/target/debug/test_key/
          key: spdm-rs-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.spdm_rs_inputs.outputs.source }}-${{ steps.spdm_rs_inputs.outputs.toolchain }}-${{ hashFiles('.github/workflows/spdm-validator.yml') }}

      - name: Restore sccache binary
        if: steps.spdm_rs_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        id: sccache_bin_restore
        with:
          path: ~/.cargo/bin/sccache
          key: sccache-bin-${{ env.SCCACHE_VERSION }}-${{
            env.SCCACHE_C_CUSTOM_CACHE_BUSTER }}

      - name: Install sccache
        if: steps.spdm_rs_cache.outputs.cache-hit != 'true' && steps.sccache_bin_restore.outputs.cache-hit != 'true'
        run: |
          cargo install sccache --version ${SCCACHE_VERSION} --no-default-features --features=gha --locked

      - name: Save sccache binary
        uses: actions/cache/save@v6
        if: steps.spdm_rs_cache.outputs.cache-hit != 'true' && steps.sccache_bin_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/sccache
          key: ${{ steps.sccache_bin_restore.outputs.cache-primary-key }}

      - name: Configure sccache
        if: steps.spdm_rs_cache.outputs.cache-hit != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('RUSTC_WRAPPER', process.env.HOME + '/.cargo/bin/sccache');
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Prepare and build spdm-rs tools
        if: steps.spdm_rs_cache.outputs.cache-hit != 'true'
        working-directory: spdm-rs
        run: |
          git submodule update --init --recursive
          sh_script/pre-build.sh
          cargo build --no-default-features --features="spdm-ring,hashed-transcript-data,async-executor,chunk-cap"
          cp -r test_key target/debug/
          ls -l target/debug/test_key/ecp384/

      - name: Package spdm-rs tools
        run: |
          test -x spdm-rs/target/debug/spdm-requester-emu
          test -f spdm-rs/target/debug/test_key/ecp384/ca.cert.der
          git -C spdm-rs rev-parse HEAD | tee spdm-rs/target/debug/spdm-rs-revision.txt
          tar -czf "${RUNNER_TEMP}/spdm-rs-tools.tar.gz" \
            -C spdm-rs \
            target/debug/spdm-requester-emu \
            target/debug/test_key \
            target/debug/spdm-rs-revision.txt

      - name: Upload spdm-rs tools
        uses: actions/upload-artifact@v7
        with:
          name: spdm-rs-tools${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}/spdm-rs-tools.tar.gz
          retention-days: 1

  spdm_emu_tests:
    if: ${{ !inputs.tools-only }}
    name: ${{ matrix.suite }}
    needs: build_spdm_emu_tools
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        suite:
          - mctp-validator
          - doe-validator
          - pcr-quote

    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_VERSION: 0.8.2
      SCCACHE_GHA_CACHE_TO: sccache-caliptra-mcu-sw
      SCCACHE_GHA_CACHE_FROM: sccache-caliptra-mcu-sw
      # CPTRA_COVERAGE_PATH: /tmp

      # Change this to a new random value if you suspect the cache is corrupted
      SCCACHE_C_CUSTOM_CACHE_BUSTER: 8b42a6e70ec4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test commit name
        run: |
          echo "Build-Test: release_ref=$(git rev-parse HEAD)"

      - name: Install required packages
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential curl gcc-multilib gcc-riscv64-unknown-elf git rustup &&
          rustup toolchain install -c clippy,rust-src,llvm-tools,rustfmt,rustc-dev

      - name: Restore sccache binary
        uses: actions/cache/restore@v6
        id: sccache_bin_restore
        with:
          path: ~/.cargo/bin/sccache
          key: sccache-bin-${{ env.SCCACHE_VERSION }}-${{
            env.SCCACHE_C_CUSTOM_CACHE_BUSTER }}

      - name: Install sccache
        if: steps.sccache_bin_restore.outputs.cache-hit != 'true'
        run: |
          cargo install sccache --version ${SCCACHE_VERSION} --no-default-features --features=gha --locked

      # Save the sccache binary immediately so we can reuse it in future runs
      # even if the rest of the current run fails.
      - name: Save sccache binary
        uses: actions/cache/save@v6
        if: steps.sccache_bin_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/sccache
          key: ${{ steps.sccache_bin_restore.outputs.cache-primary-key }}

      - name: Configure sccache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('RUSTC_WRAPPER', process.env.HOME + '/.cargo/bin/sccache');
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Download spdm-emu tools
        uses: actions/download-artifact@v8
        with:
          name: spdm-emu-tools${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}

      - name: Extract spdm-emu tools
        run: |
          mkdir -p spdm-emu
          tar -xzf "${RUNNER_TEMP}/spdm-emu-tools.tar.gz" -C spdm-emu
          cat spdm-emu/build/bin/spdm-emu-revision.txt

      - name: Generate SPDM nonce
        run: |
          echo "SPDM_NONCE=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Run SPDM validator tests on MCTP transport
        if: matrix.suite == 'mctp-validator'
        id: mctp_validator
        continue-on-error: true
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-emu/build/bin
        run: |
          echo "SPDM_NONCE in MCTP stage: ${SPDM_NONCE}"
          echo "SPDM_NONCE length: ${#SPDM_NONCE}"
          cargo xtask all-build
          timeout --signal=TERM --kill-after=30s 30m \
            cargo t -p caliptra-mcu-tests-integration -- --test test_mctp_spdm_responder_conformance --nocapture --include-ignored
          sccache --show-stats

      - name: Upload logs and traces for MCTP transport
        if: always() && matrix.suite == 'mctp-validator'
        uses: actions/upload-artifact@v7
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-emu/build/bin
        with:
          name: spdm-mctp-validator-test-results
          path: |
            ${{ env.SPDM_VALIDATOR_DIR }}/test.log
            ${{ env.SPDM_VALIDATOR_DIR }}/caliptra_spdm_validator.pcap
            ${{ env.SPDM_VALIDATOR_DIR }}/spdm_device_validator_output.txt

      - name: Check SPDM Validator test results on MCTP transport
        if: always() && matrix.suite == 'mctp-validator'
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-emu/build/bin
          VALIDATOR_RESULT: ${{ steps.mctp_validator.outcome }}
        run: |
          cat "$SPDM_VALIDATOR_DIR/test.log"
          test "$VALIDATOR_RESULT" = success
          grep -q '^test result done$' "$SPDM_VALIDATOR_DIR/test.log"
          if grep -E 'test suite \(.*\) - pass: [0-9]+, fail: [1-9][0-9]*' \
              "$SPDM_VALIDATOR_DIR/test.log"; then
            echo "Test suite had failures."
            exit 1
          fi

      - name: Run SPDM attestation test on MCTP transport (PCR Quote measurements)
        if: matrix.suite == 'pcr-quote'
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-emu/build/bin
        run: |
          cargo xtask all-build
          timeout --signal=TERM --kill-after=30s 30m \
            cargo t -p caliptra-mcu-tests-integration -- --test test_mctp_spdm_attestation_pcr_quote --nocapture --include-ignored

      - name: Upload attestation logs and traces for MCTP transport
        if: always() && matrix.suite == 'pcr-quote'
        uses: actions/upload-artifact@v7
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-emu/build/bin
        with:
          name: spdm-mctp-attestation-results
          if-no-files-found: warn
          path: |
            ${{ env.SPDM_VALIDATOR_DIR }}/spdm_requester_emu_output.txt
            ${{ env.SPDM_VALIDATOR_DIR }}/caliptra-evidence.pcap
            ${{ env.SPDM_VALIDATOR_DIR }}/measurement_block_*.bin

      - name: Run SPDM validator tests on DOE transport
        id: doe_validator
        if: matrix.suite == 'doe-validator'
        continue-on-error: true
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-emu/build/bin
        run: |
          cargo xtask all-build
          timeout --signal=TERM --kill-after=30s 30m \
            cargo t -p caliptra-mcu-tests-integration -- --test test_doe_spdm_responder_conformance --nocapture --include-ignored
          sccache --show-stats

      - name: Upload logs and traces for DOE transport
        if: always() && matrix.suite == 'doe-validator'
        uses: actions/upload-artifact@v7
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-emu/build/bin
        with:
          name: spdm-doe-validator-test-results
          path: |
            ${{ env.SPDM_VALIDATOR_DIR }}/test.log
            ${{ env.SPDM_VALIDATOR_DIR }}/caliptra_spdm_validator.pcap
            ${{ env.SPDM_VALIDATOR_DIR }}/spdm_device_validator_output.txt

      - name: Check SPDM Validator test results on DOE transport
        if: always() && matrix.suite == 'doe-validator'
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-emu/build/bin
          VALIDATOR_RESULT: ${{ steps.doe_validator.outcome }}
        run: |
          cat "$SPDM_VALIDATOR_DIR/test.log"
          test "$VALIDATOR_RESULT" = success
          grep -q '^test result done$' "$SPDM_VALIDATOR_DIR/test.log"
          if grep -E 'test suite \(.*\) - pass: [0-9]+, fail: [1-9][0-9]*' \
              "$SPDM_VALIDATOR_DIR/test.log"; then
            echo "Test suite had failures."
            exit 1
          fi

  tdisp_ide_tests:
    if: ${{ !inputs.tools-only }}
    name: tdisp-ide
    needs: build_spdm_rs_tools
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CARGO_INCREMENTAL: 0
      SCCACHE_VERSION: 0.8.2
      SCCACHE_GHA_CACHE_TO: sccache-caliptra-mcu-sw
      SCCACHE_GHA_CACHE_FROM: sccache-caliptra-mcu-sw
      # CPTRA_COVERAGE_PATH: /tmp

      # Change this to a new random value if you suspect the cache is corrupted
      SCCACHE_C_CUSTOM_CACHE_BUSTER: 8b42a6e70ec4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Test commit name
        run: |
          echo "Build-Test: release_ref=$(git rev-parse HEAD)"

      - name: Install required packages
        run: |
          sudo apt-get update -qy && \
          sudo apt-get install -qy build-essential curl gcc-multilib gcc-riscv64-unknown-elf git rustup &&
          rustup toolchain install -c clippy,rust-src,llvm-tools,rustfmt,rustc-dev

      - name: Restore sccache binary
        uses: actions/cache/restore@v6
        id: sccache_bin_restore
        with:
          path: ~/.cargo/bin/sccache
          key: sccache-bin-${{ env.SCCACHE_VERSION }}-${{
            env.SCCACHE_C_CUSTOM_CACHE_BUSTER }}

      - name: Install sccache
        if: steps.sccache_bin_restore.outputs.cache-hit != 'true'
        run: |
          cargo install sccache --version ${SCCACHE_VERSION} --no-default-features --features=gha --locked

      - name: Save sccache binary
        uses: actions/cache/save@v6
        if: steps.sccache_bin_restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/sccache
          key: ${{ steps.sccache_bin_restore.outputs.cache-primary-key }}

      - name: Configure sccache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('RUSTC_WRAPPER', process.env.HOME + '/.cargo/bin/sccache');
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Download spdm-rs tools
        uses: actions/download-artifact@v8
        with:
          name: spdm-rs-tools${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}

      - name: Extract spdm-rs tools
        run: |
          mkdir -p spdm-rs
          tar -xzf "${RUNNER_TEMP}/spdm-rs-tools.tar.gz" -C spdm-rs
          cp ${{ github.workspace }}/ocp-eat-verifier/ocptoken/test-data/ta-store/roots/slot0_ecc_test_root_ca.der \
             ${{ github.workspace }}/spdm-rs/target/debug/test_key/ecp384/ca.cert.der
          cat spdm-rs/target/debug/spdm-rs-revision.txt

      - name: Generate SPDM nonce
        run: |
          echo "SPDM_NONCE=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Run CCC spdm-requester-emu tests for TDISP+IDE
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-rs/target/debug
        run: |
          cargo xtask all-build
          timeout --signal=TERM --kill-after=30s 30m \
            cargo t -p caliptra-mcu-tests-integration -- --test test_doe_spdm_tdisp_ide_validator --nocapture --include-ignored
          sccache --show-stats

      - name: Display CCC spdm-requester-emu test results for TDISP+IDE
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-rs/target/debug
        run: |
          cat $SPDM_VALIDATOR_DIR/tdisp_ide_validator_output.txt

      - name: Upload CCC spdm-requester-emu test results for TDISP+IDE
        if: always()
        uses: actions/upload-artifact@v7
        env:
          SPDM_VALIDATOR_DIR: ${{ github.workspace }}/spdm-rs/target/debug
        with:
          name: spdm-tdisp-ide-validator-test-results
          path: |
            ${{ env.SPDM_VALIDATOR_DIR }}/tdisp_ide_validator_output.txt
