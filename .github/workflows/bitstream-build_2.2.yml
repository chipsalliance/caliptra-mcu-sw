name: FPGA Bitstream build 2.2 (latest)

on:
  pull_request:
    paths:
      - ".github/workflows/bitstream-build.yml"
      - ".github/workflows/bitstream-build_2.2.yml"
      - "hw/latest/**"
  workflow_dispatch:
    inputs:
      dual-itrng:
        description: Build the standard dual-iTRNG lab image
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-bitstream:
    uses: ./.github/workflows/bitstream-build.yml
    with:
      hw-version: "2.2"
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
      fpga-path: hw/latest/fpga
      rtl-path: hw/latest/caliptra-ss
      target-branch: ${{ github.base_ref || github.ref_name }}
      dual-itrng: ${{ inputs.dual-itrng || github.head_ref == 'lab/fpga-2.2-dual-itrng' }}
