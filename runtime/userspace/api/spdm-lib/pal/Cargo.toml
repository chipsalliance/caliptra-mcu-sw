[package]
name = "caliptra-mcu-spdm-pal"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
caliptra-mcu-cert-store = { workspace = true }
caliptra-mcu-attestation-evidence = { workspace = true }
caliptra-mcu-spdm-traits = { workspace = true }
caliptra-mcu-spdm-codec = { workspace = true }
caliptra-mcu-measurement-api = { workspace = true }
mcu-caliptra-api = { workspace = true, features = ["mailbox-io"] }
caliptra-mcu-scratch-alloc = { workspace = true }
mcu-error = { workspace = true }
caliptra-mcu-libsyscall-caliptra = { workspace = true, optional = true }
caliptra-mcu-libtock_platform = { workspace = true, optional = true }
caliptra-mcu-libtock_alarm = { workspace = true, optional = true }
caliptra-mcu-libtockasync = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
zerocopy = { workspace = true }

[dev-dependencies]
futures.workspace = true

[features]
default = []
pcr-quote = ["caliptra-mcu-attestation-evidence/pcr-quote"]
set-certificate = [
  "caliptra-mcu-cert-store/set-certificate",
  "caliptra-mcu-spdm-traits/set-certificate",
]
# HEARTBEAT liveness watchdog: pulls in the libtock alarm capsule so the PAL
# can give the stack a monotonic clock (now_ms) and a cancellation-safe delay
# (sleep_ms, serialized by an embassy-sync mutex).
# Do not enable this directly: use the user app's `spdm-set-heartbeat`, which also
# enables the stack feature.
spdm-set-heartbeat = [
  "caliptra-mcu-libsyscall-caliptra",
  "caliptra-mcu-libtock_platform",
  "caliptra-mcu-libtock_alarm",
  "caliptra-mcu-libtockasync",
  "embassy-sync",
]
