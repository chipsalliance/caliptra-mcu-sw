[package]
name = "caliptra-mcu-spdm-pal"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
caliptra-mcu-cert-store = { workspace = true }
caliptra-mcu-attestation-evidence = { workspace = true }
caliptra-mcu-spdm-traits = { workspace = true }
caliptra-mcu-spdm-codec = { workspace = true }
caliptra-mcu-measurement-api = { workspace = true }
mcu-caliptra-api = { workspace = true, features = ["mailbox-io"] }
caliptra-mcu-scratch-alloc = { workspace = true }
mcu-error = { workspace = true }
zerocopy = { workspace = true }

[dev-dependencies]
futures.workspace = true

[features]
default = []
pcr-quote = ["caliptra-mcu-attestation-evidence/pcr-quote"]
set-certificate = [
  "caliptra-mcu-cert-store/set-certificate",
  "caliptra-mcu-spdm-traits/set-certificate",
]
