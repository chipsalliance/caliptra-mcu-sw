[package]
name = "caliptra-mcu-runtime-fpga"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
arrayvec.workspace = true
capsules-core.workspace = true
capsules-extra.workspace = true
caliptra-mcu-capsules-emulator.workspace = true
caliptra-mcu-capsules-runtime.workspace = true
capsules-system.workspace = true
components.workspace = true
caliptra-mcu-dma-driver.workspace = true
caliptra-mcu-external-otp-driver.workspace = true
caliptra-mcu-external-otp-emulator.workspace = true
caliptra-mcu-flash-ctrl-fpga.workspace = true
caliptra-mcu-flash-driver.workspace = true
caliptra-mcu-i3c-driver.workspace = true
kernel.workspace = true
caliptra-mcu-components.workspace = true
caliptra-mcu-config.workspace = true
caliptra-mcu-config-fpga.workspace = true
caliptra-mcu-mbox-driver.workspace = true
caliptra-mcu-platforms-common.workspace = true
caliptra-mcu-tock-veer.workspace = true
caliptra-mcu-registers-generated.workspace = true
caliptra-mcu-romtime.workspace = true
tock-registers.workspace = true


[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv-csr.workspace = true
riscv.workspace = true
rv32i.workspace = true

[features]
default = ["all-features"]
disable-lms-sig-verify = []
all-features = [
	"spdm",
	"streaming-boot",
	"flash-boot",
	"firmware-update",
	"doe",
	"userspace-log",
	"mctp-vdm-service",
]
spdm = ["mcu-mbox-service"]
streaming-boot = []
# Flash partitions and logging use the same flash mux. Keep the logging
# FlashUser registered for boot and update images so partition I/O retains the
# working mux topology used by the full kernel.
flash-boot = ["userspace-log"]
firmware-update = ["userspace-log"]
mcu-mbox-service = []
mctp-vdm-service = []
doe = ["spdm"]
userspace-log = []
debug = []
hw-2-1 = []
# See `mcu-runtime-emulator`'s `release` feature for rationale.
release = [
	"userspace-log",
	"kernel/no_debug_panics",
	"caliptra-mcu-romtime/no-print",
]
test-caliptra-certs = []
test-caliptra-crypto = []
test-caliptra-mailbox = []
test-caliptra-util-host-validator = ["mcu-mbox-service"]
test-defmt-logging-mailbox = ["userspace-log", "mcu-mbox-service"]
test-defmt-logging-release = ["userspace-log", "mcu-mbox-service"]
test-defmt-logging-vdm = ["userspace-log", "mcu-mbox-service", "mctp-vdm-service"]
test-dma = []
test-doe-transport-loopback = []
test-doe-discovery = ["doe"]
test-doe-user-loopback = ["doe"]
test-do-nothing = []
test-exit-immediately = []
test-get-alarm-expired = []
test-external-otp = []
test-get-device-state = []
test-i3c-simple = []
test-i3c-constant-writes = []
test-flash-based-boot = ["flash-boot"]
test-flash-ctrl-init = []
test-flash-ctrl-read-write-page = []
test-flash-ctrl-erase-page = []
test-flash-storage-read-write = []
test-flash-storage-erase = []
test-flash-usermode = ["flash-boot"]
test-log-flash-circular = []
test-log-flash-linear = []
test-log-flash-usermode = ["crash-log", "userspace-log"]
test-firmware-activate = ["firmware-update"]
test-firmware-update-streaming = ["firmware-update"]
test-fpga-flash-ctrl = ["flash-boot"]
test-mbox-sram = []
test-firmware-v2 = []
test-mci = []
test-mctp-ctrl-cmds = ["spdm", "streaming-boot", "mctp-vdm-service"]
test-mctp-capsule-loopback = []
test-mctp-capsule-loopback-warm-reset = []
test-mctp-user-loopback = ["mctp-vdm-service"]
test-mctp-vdm-cmds = ["mctp-vdm-service", "userspace-log"]
test-mcu-mbox-driver = []
test-mcu-mbox-cmds = ["mcu-mbox-service"]
test-mcu-mbox-fips-self-test = ["mcu-mbox-service"]
test-mcu-mbox-fips-periodic = ["mcu-mbox-service"]
test-mcu-mbox-soc-requester-loopback = []
test-mcu-mbox-usermode = ["mcu-mbox-service"]
test-mcu-rom-flash-access = []
test-mcu-svn-gt-fuse = []
test-mcu-svn-lt-fuse = []
test-pldm-request-response = ["streaming-boot"]
test-pldm-discovery = ["streaming-boot"]
test-pldm-fw-update = ["firmware-update"]
test-pldm-fw-update-e2e = ["firmware-update"]
test-pldm-streaming-boot = ["streaming-boot"]
test-mctp-spdm-attestation = ["spdm", "flash-boot"]
test-mctp-spdm-attestation-tcb = ["spdm", "flash-boot"]
test-mctp-spdm-attestation-mixed = ["spdm", "flash-boot"]
test-mctp-spdm-attestation-pcr-quote = ["spdm"]
test-mctp-spdm-responder-conformance = ["spdm"]
test-mctp-spdm-set-certificate = ["spdm", "flash-boot"]
test-doe-spdm-responder-conformance = ["doe"]
test-doe-spdm-tdisp-ide-validator = ["doe"]
crash-log = ["caliptra-mcu-config-fpga/crash-log"]
ocp-lock = ["caliptra-mcu-romtime/ocp-lock", "caliptra-mcu-capsules-runtime/ocp-lock", "caliptra-mcu-components/ocp-lock", "caliptra-mcu-platforms-common/ocp-lock"]
test-ocp-lock = ["ocp-lock", "test-exit-immediately"]
test-handoff = ["ocp-lock", "test-exit-immediately"]
